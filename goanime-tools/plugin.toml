id = "mcookinho/goanime-tools"
name = "GoAnime Tools"
version = "1.3.0"
plugin_api = 9
author = "mcookinho"
license = "MIT"
dependencies = []
tags = ["anime", "media", "download", "utility", "panel", "launcher"]
icon = "movie"
description = "Drive the GoAnime CLI from a pretty panel: search, watch or download episodes/ranges/whole shows with chosen source and quality."

[[panel]]
id = "dashboard"
entry = "panel.luau"
width = 680
height = 760
placement = "floating"
position = "center"

# Bar icon that opens the panel.
[[widget]]
id = "open"
entry = "widget.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  default = "movie"
  label_key = "settings.bar.glyph.label"
  description_key = "settings.bar.glyph.description"

[[launcher_provider]]
id = "search"
entry = "launcher.luau"
prefix = "goanime"
glyph = "movie"
include_in_global_search = false

[[setting]]
key = "language"
type = "select"
label_key = "settings.language.label"
description_key = "settings.language.description"
default = "default"
options = [
    { value = "default", label_key = "settings.language.default" },
    { value = "en", label_key = "settings.language.en" },
    { value = "pt-BR", label_key = "settings.language.pt-BR" },
]

[[setting]]
key = "source_default"
type = "select"
label_key = "settings.source.label"
description_key = "settings.source.description"
default = "all"
options = [
    { value = "all", label_key = "settings.source.all" },
    { value = "allanime", label_key = "settings.source.allanime" },
    { value = "animefire", label_key = "settings.source.animefire" },
    { value = "goyabu", label_key = "settings.source.goyabu" },
]

[[setting]]
key = "quality_default"
type = "string"
label_key = "settings.quality.label"
description_key = "settings.quality.description"
default = "best"

[[setting]]
key = "download_dir"
type = "string"
label_key = "settings.download_dir.label"
description_key = "settings.download_dir.description"
default = ""

[[setting]]
key = "open_after_download"
type = "bool"
label_key = "settings.open_after.label"
description_key = "settings.open_after.description"
default = true