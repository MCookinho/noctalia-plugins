id = "mcookinho/osint-tools"
name = "OSINT Tools"
version = "1.3.0"
plugin_api = 9
author = "mcookinho"
license = "MIT"
dependencies = []
tags = ["osint", "security", "utility", "panel", "launcher"]
icon = "user-search"
description = "Key-free OSINT dashboard: check a username across 35 public platforms (social, video, dev, games), map related people (GitHub followers, Mastodon following, Instagram mentions), link a Gravatar e-mail to its social profiles, enrich brazilian phones (DDD/city/region/line type) and validate CPF."

[[widget]]
id = "bar"
entry = "widget.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.widget_glyph.label"
  description_key = "settings.widget_glyph.description"
  default = "user-search"

[[panel]]
id = "dashboard"
entry = "panel.luau"
width = 640
height = 720
placement = "floating"
position = "center"

[[launcher_provider]]
id = "search"
entry = "launcher.luau"
prefix = "osint"
glyph = "user-search"
include_in_global_search = false

[[setting]]
key = "language"
type = "select"
label_key = "settings.language.label"
description_key = "settings.language.description"
default = "default"
options = [
    { value = "default", label_key = "settings.language.default" },
    { value = "en", label_key = "settings.language.en" },
    { value = "pt-BR", label_key = "settings.language.pt-BR" },
]

[[setting]]
key = "site_checks"
type = "bool"
label_key = "settings.site_checks.label"
description_key = "settings.site_checks.description"
default = true