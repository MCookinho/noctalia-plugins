id = "mcookinho/osint-tools"
name = "OSINT Tools"
version = "1.1.0"
plugin_api = 9
author = "mcookinho"
license = "MIT"
dependencies = []
tags = ["osint", "security", "utility", "panel", "launcher"]
icon = "user-search"
description = "Key-free OSINT dashboard: relationship graph by username, e-mail, CPF or phone."

[[widget]]
id = "bar"
entry = "widget.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.widget_glyph.label"
  description_key = "settings.widget_glyph.description"
  default = "user-search"

[[panel]]
id = "dashboard"
entry = "panel.luau"
width = 640
height = 720
placement = "floating"
position = "center"

[[launcher_provider]]
id = "search"
entry = "launcher.luau"
prefix = "osint"
glyph = "user-search"
include_in_global_search = false

[[setting]]
key = "site_checks"
type = "bool"
label_key = "settings.site_checks.label"
description_key = "settings.site_checks.description"
default = true