id = "mcookinho/osint-tools"
name = "OSINT Tools"
version = "1.0.1"
plugin_api = 9
author = "mcookinho"
license = "MIT"
dependencies = []
tags = ["osint", "security", "utility", "panel", "launcher"]
icon = "user-search"
description = "OSINT investigation dashboard: public info by username, e-mail, CPF or phone, straight from the shell."

[[widget]]
id = "bar"
entry = "widget.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.widget_glyph.label"
  description_key = "settings.widget_glyph.description"
  default = "user-search"

[[panel]]
id = "dashboard"
entry = "panel.luau"
width = 640
height = 720
placement = "floating"
position = "center"

[[launcher_provider]]
id = "search"
entry = "launcher.luau"
prefix = "osint"
glyph = "user-search"
include_in_global_search = false

[[setting]]
key = "site_checks"
type = "bool"
label_key = "settings.site_checks.label"
description_key = "settings.site_checks.description"
default = true

[[setting]]
key = "emailrep_key"
type = "string"
label_key = "settings.emailrep_key.label"
description_key = "settings.emailrep_key.description"
default = ""
advanced = true

[[setting]]
key = "cpf_api_url"
type = "string"
label_key = "settings.cpf_api_url.label"
description_key = "settings.cpf_api_url.description"
default = ""
advanced = true

[[setting]]
key = "cpf_api_token"
type = "string"
label_key = "settings.cpf_api_token.label"
description_key = "settings.cpf_api_token.description"
default = ""
advanced = true

[[setting]]
key = "phone_api_key"
type = "string"
label_key = "settings.phone_api_key.label"
description_key = "settings.phone_api_key.description"
default = ""
advanced = true

[[setting]]
key = "phone_api_url"
type = "string"
label_key = "settings.phone_api_url.label"
description_key = "settings.phone_api_url.description"
default = "https://apilayer.net/api/validate?access_key={api_key}&number={phone}"
advanced = true